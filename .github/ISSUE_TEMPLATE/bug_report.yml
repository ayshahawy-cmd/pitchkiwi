name: Bug report
description: Report a reproducible VibeFlow problem using synthetic data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private recordings, transcripts, clipboard contents, credentials, or client code. Use synthetic examples.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VibeFlow version or commit
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: M2 MacBook Air, macOS 15.x
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Local model and digest if relevant
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction steps
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Relevant permission state
      options:
        - Microphone and Accessibility granted
        - Microphone only
        - Accessibility only
        - Neither
        - Not relevant
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal, credential, client, and unreleased-source data from this report.
          required: true

