name: Feature request
description: Propose a focused, local-first improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Data, permission, and offline impact
      description: What new data would this read/store, what permission would it need, and can it work offline?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This does not require dictated content to leave the Mac.
          required: true

