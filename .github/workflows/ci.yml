name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned native framework
        run: ./scripts/bootstrap.sh --framework-only
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build and verify distributable app
        run: ./scripts/package-release.sh
      - name: Upload community build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PitchKiwi-macOS-${{ github.sha }}
          path: |
            .build/PitchKiwi-macOS.zip
            .build/PitchKiwi-macOS.zip.sha256
          retention-days: 14
