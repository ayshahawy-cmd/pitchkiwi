name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned native framework
        run: ./scripts/bootstrap.sh --framework-only
      - name: Build
        run: swift build
      - name: Test
        run: swift test
